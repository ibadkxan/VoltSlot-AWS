services:
  mysql:
    image: mysql:8.0
    container_name: voltslot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-localdemo123}
      MYSQL_DATABASE: ${DB_NAME:-ev_charging_db}
    ports:
      - "3307:3306"
    volumes:
      - voltslot_mysql_data:/var/lib/mysql
      - ./ev_charging_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-localdemo123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: voltslot-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: development
      SECRET_KEY: local-compose-only-change-this
      COOKIE_SECURE: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ev_charging_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-localdemo123}
      AWS_REGION: ap-south-1
      SNS_BOOKING_TOPIC_ARN: ""
      PORT: 5000
    ports:
      - "5001:5000"

volumes:
  voltslot_mysql_data:
